<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TekaSend Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="window">

    <!-- Settings-style navigation and app identity -->
    <header class="app-header">
      <div class="nav-bar">
        <button type="button" class="back-disc" id="closePopup" aria-label="Close settings">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="m10 3-5 5 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <span class="nav-title">Settings</span>
        <span class="nav-spacer" aria-hidden="true"></span>
      </div>
      <div class="app-identity">
        <img class="app-logo" src="icons/tekasend-logo.svg" alt="TekaSend shield and paper-plane logo">
        <h1 class="app-title">TekaSend</h1>
      </div>
    </header>

    <!-- Main settings groups -->
    <main class="content">

      <section class="section" aria-label="Masking effect">
        <p class="section-label">Masking Effect</p>
        <div class="card effect-card" role="radiogroup" aria-label="Effect applied to detected text">
          <label class="effect-row">
            <span class="row-icon effect-icon" aria-hidden="true">◌</span>
            <span class="effect-copy"><span class="row-title">Blur</span><span class="row-desc">Soft focus</span></span>
            <input class="effect-radio" type="radio" name="defaultEffect" value="blur">
          </label>
          <div class="separator"></div>
          <label class="effect-row">
            <span class="row-icon effect-icon" aria-hidden="true">Aa</span>
            <span class="effect-copy"><span class="row-title">Replace values</span><span class="row-desc">Dummy text, same length</span></span>
            <input class="effect-radio" type="radio" name="defaultEffect" value="dummy">
          </label>
          <div class="separator"></div>
          <label class="effect-row">
            <span class="row-icon effect-icon" aria-hidden="true">[ ]</span>
            <span class="effect-copy"><span class="row-title">Placeholder</span><span class="row-desc">A label in place of the text</span></span>
            <input class="effect-radio" type="radio" name="defaultEffect" value="placeholder">
          </label>
          <div class="separator"></div>
          <label class="effect-row">
            <span class="row-icon effect-icon" aria-hidden="true">✦</span>
            <span class="effect-copy"><span class="row-title">Spoiler</span><span class="row-desc">Floating particles</span></span>
            <input class="effect-radio" type="radio" name="defaultEffect" value="spoiler" checked>
          </label>
        </div>
        <p class="effect-hint">The selected effect masks detected text on click, or automatically when Hide by default is on. Click masked text to restore.</p>
        <div class="card auto-mask-card">
          <label class="row" for="hideByDefault">
            <div class="row-info">
              <span class="row-icon icon-appearance" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12s3.3-5 9-5 9 5 9 5-3.3 5-9 5-9-5-9-5Z"/><circle cx="12" cy="12" r="2.5"/><path d="M4 20 20 4"/></svg></span>
              <div>
                <span class="row-title">Hide by default</span>
                <span class="row-desc">Mask detected text as pages load</span>
              </div>
            </div>
            <input type="checkbox" id="hideByDefault" class="toggle">
          </label>
        </div>
      </section>

      <!-- Detection Categories -->
      <section class="section" aria-label="Detection categories">
        <p class="section-label">Detection</p>
        <div class="card">

          <label class="row" for="cat_api_key">
            <div class="row-info">
              <span class="row-icon icon-key" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="9" r="3.5"/><path d="m10.5 11.5 8 8M16 17l2-2m-4 0 2-2"/></svg></span>
              <div>
                <span class="row-title">API Keys &amp; Tokens</span>
                <span class="row-desc">OpenAI, GitHub, AWS credentials</span>
              </div>
            </div>
            <input type="checkbox" id="cat_api_key" class="toggle" checked>
          </label>

          <div class="separator"></div>

          <label class="row" for="cat_password">
            <div class="row-info">
              <span class="row-icon icon-lock" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 4v2"/></svg></span>
              <div>
                <span class="row-title">Passwords &amp; Secrets</span>
                <span class="row-desc">Plain-text secrets and auth tokens</span>
              </div>
            </div>
            <input type="checkbox" id="cat_password" class="toggle" checked>
          </label>

          <div class="separator"></div>

          <label class="row" for="cat_personal">
            <div class="row-info">
              <span class="row-icon icon-person" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg></span>
              <div>
                <span class="row-title">Personal Information</span>
                <span class="row-desc">Names, emails, phone numbers</span>
              </div>
            </div>
            <input type="checkbox" id="cat_personal" class="toggle" checked>
          </label>

          <div class="separator"></div>

          <label class="row" for="cat_financial">
            <div class="row-info">
              <span class="row-icon icon-card" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg></span>
              <div>
                <span class="row-title">Payment &amp; IDs</span>
                <span class="row-desc">Credit cards, SSN, government IDs</span>
              </div>
            </div>
            <input type="checkbox" id="cat_financial" class="toggle" checked>
          </label>

        </div>
      </section>

      <section class="section" aria-label="Appearance">
        <p class="section-label">Appearance</p>
        <div class="card appearance-card">
          <div class="appearance-row">
            <span class="row-icon icon-appearance" aria-hidden="true">◐</span>
            <span class="row-title">Theme</span>
          </div>
          <div class="theme-control" role="group" aria-label="Theme preference">
            <button type="button" class="theme-btn" data-theme-value="auto" id="themeAuto" aria-pressed="false">Auto</button>
            <button type="button" class="theme-btn active" data-theme-value="light" id="themeLight" aria-pressed="true">Light</button>
            <button type="button" class="theme-btn" data-theme-value="dark" id="themeDark" aria-pressed="false">Dark</button>
          </div>
        </div>
        <div class="card tooltip-card">
          <label class="row" for="showHoverTooltip">
            <div class="row-info">
              <span class="row-icon icon-appearance" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/></svg></span>
              <div>
                <span class="row-title">Show hover tips</span>
                <span class="row-desc">Hints over highlighted text</span>
              </div>
            </div>
            <input type="checkbox" id="showHoverTooltip" class="toggle" checked>
          </label>
        </div>
      </section>

    </main>

    <footer class="app-footer">
      <span class="footer-text">TekaSend • Real-time Privacy Guardian</span>
    </footer>

  </div>

  <script src="popup.js"></script>
</body>
</html>
